<header class="site-header">

    <a class="brand" href="{{ url_for('index') }}" aria-label="RentWise home">

        <span class="brand-mark">R</span>

        <span>RentWise</span>

    </a>

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container-fluid p-0">

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#dashboardNavbar"
                aria-controls="dashboardNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                ☰
            </button>

            <div
                class="collapse navbar-collapse"
                id="dashboardNavbar"
            >

                <div class="navbar-nav ms-auto">

                    <a
                        class="nav-link"
                        href="{{ url_for('dashboard') }}"
                    >
                        Dashboard
                    </a>

                    <a
                        class="nav-link"
                        href="{{ url_for('listings') }}"
                    >
                        Listings
                    </a>

                    <a
                        class="nav-link"
                        href="{{ url_for('rent_prediction') }}"
                    >
                        Rent Prediction
                    </a>

                    <button
                        class="mobile-profile-toggle"
                        type="button"
                        onclick="openProfile()"
                    >
                        {{ (session.get('user_name') or 'Renter')[:1] | upper }}
                    </button>

                </div>

            </div>

        </div>

    </nav>

    <div class="header-actions">

        <button
            class="profile-toggle"
            type="button"
            aria-label="Open user profile"
            aria-controls="profile-sidebar"
            aria-expanded="false"
        >

            {{ (session.get('user_name') or 'Renter')[:1] | upper }}

        </button>

    </div>

</header>
